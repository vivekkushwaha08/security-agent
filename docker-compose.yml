services:
  security-agent:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      SECURITY_AGENT_CONFIG: /app/config/security_agent.json
      SECURITY_AGENT_PROMPTS: /app/config/prompts
    volumes:
      - ./config:/app/config
      - ./reports:/app/reports
      - ./workspaces:/app/workspaces
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
